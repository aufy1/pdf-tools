services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - web_static:/usr/share/nginx/html

  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always

  frontend:
    build:
      target: prod
    environment:
      - NODE_ENV=production
    volumes:
      - web_static:/app/dist 
    command: sh -c "npm run build && cp -r dist/* /app/dist/ && tail -f /dev/null"