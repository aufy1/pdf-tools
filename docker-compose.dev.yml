services:
  nginx:
    ports:
      - "8098:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./server:/app

  frontend:
    build:
      target: dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=/api
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host